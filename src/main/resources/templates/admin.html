<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>Admin Panel</h2>

    <div class="row mb-4">
        <div class="col-md-6">
            <form th:action="@{/admin/save}" method="post" class="card p-3">
                <h5>Add New User</h5>
                <input type="hidden" name="id" th:value="${newUser.id}"/>
                <div class="mb-2">
                    <input type="text" name="username" class="form-control" placeholder="Username" required/>
                </div>
                <div class="mb-2">
                    <input type="password" name="password" class="form-control" placeholder="Password" required/>
                </div>
                <div class="mb-2">
                    <input type="text" name="firstName" class="form-control" placeholder="First Name" required/>
                </div>
                <div class="mb-2">
                    <input type="text" name="lastName" class="form-control" placeholder="Last Name" required/>
                </div>
                <div class="mb-2">
                    <input type="number" name="year" class="form-control" placeholder="Year" required/>
                </div>
                <div class="mb-2">
                    <label class="form-label">Roles</label>
                    <div class="form-check">
                        <input type="checkbox" name="roles" value="ROLE_USER" id="roleUser" class="form-check-input"/>
                        <label for="roleUser" class="form-check-label">ROLE_USER</label>
                    </div>
                    <div class="form-check">
                        <input type="checkbox" name="roles" value="ROLE_ADMIN" id="roleAdmin" class="form-check-input"/>
                        <label for="roleAdmin" class="form-check-label">ROLE_ADMIN</label>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Save</button>
            </form>
        </div>
    </div>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Username</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Year</th>
            <th>Roles</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}">
            <td th:text="${user.id}"></td>
            <td th:text="${user.username}"></td>
            <td th:text="${user.firstName}"></td>
            <td th:text="${user.lastName}"></td>
            <td th:text="${user.year}"></td>
            <td>
                <span th:each="role : ${user.roles}" th:text="${role.name}" class="badge bg-secondary me-1"></span>
            </td>
            <td>
                <form th:action="@{/admin/update}" method="post" style="display:inline;">
                    <input type="hidden" name="id" th:value="${user.id}"/>
                    <input type="text" name="firstName" th:value="${user.firstName}" class="form-control form-control-sm mb-1" required/>
                    <input type="text" name="lastName" th:value="${user.lastName}" class="form-control form-control-sm mb-1" required/>
                    <input type="number" name="year" th:value="${user.year}" class="form-control form-control-sm mb-1" required/>
                    <div class="mb-1 form-check">
                        <input type="checkbox" name="roles" value="ROLE_USER"
                               th:checked="${#lists.contains(user.roles.![name], 'ROLE_USER')}" class="form-check-input me-1"/>
                        <label class="form-check-label">ROLE_USER</label>
                    </div>
                    <div class="mb-1 form-check">
                        <input type="checkbox" name="roles" value="ROLE_ADMIN"
                               th:checked="${#lists.contains(user.roles.![name], 'ROLE_ADMIN')}" class="form-check-input me-1"/>
                        <label class="form-check-label">ROLE_ADMIN</label>
                    </div>
                    <button type="submit" class="btn btn-sm btn-warning">Update</button>
                </form>
                <form th:action="@{/admin/delete}" method="get" style="display:inline;">
                    <input type="hidden" name="id" th:value="${user.id}"/>
                    <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <a href="/logout" class="btn btn-secondary">Logout</a>
</div>
</body>
</html>
