<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>User Page</h2>
    <p>Welcome, <span th:text="${user.username}"></span>!</p>

    <table class="table table-bordered" style="max-width: 400px;">
        <tr><th>ID</th><td th:text="${user.id}"></td></tr>
        <tr><th>Username</th><td th:text="${user.username}"></td></tr>
        <tr><th>First Name</th><td th:text="${user.firstName}"></td></tr>
        <tr><th>Last Name</th><td th:text="${user.lastName}"></td></tr>
        <tr><th>Year</th><td th:text="${user.year}"></td></tr>
        <tr><th>Roles</th>
            <td>
                <span th:each="role : ${user.roles}" th:text="${role.name}" class="badge bg-info me-1"></span>
            </td>
        </tr>
    </table>

    <a href="/logout" class="btn btn-secondary">Logout</a>
</div>
</body>
</html>
